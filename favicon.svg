<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1c1833"/>
      <stop offset="100%" stop-color="#0c0a14"/>
    </linearGradient>
    <linearGradient id="brain" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5be0eb"/>
      <stop offset="45%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="bolt" x1="28" y1="16" x2="36" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background rounded squircle with subtle neon border -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bg)" stroke="#8b5cf6" stroke-width="2.5" stroke-opacity="0.6"/>
  <!-- Left hemisphere -->
  <path d="M29 15 C24 10 16 12 15 18 C9 18 6 25 10 30 C5 34 8 42 14 43 C12 50 19 54 26 50 L30 46 L30 18 Z"
        fill="none" stroke="url(#brain)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right hemisphere -->
  <path d="M35 15 C40 10 48 12 49 18 C55 18 58 25 54 30 C59 34 56 42 50 43 C52 50 45 54 38 50 L34 46 L34 18 Z"
        fill="none" stroke="url(#brain)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Neural bridges -->
  <path d="M20 28 C24 28 26 31 30 31" fill="none" stroke="url(#brain)" stroke-width="2" stroke-linecap="round"/>
  <path d="M44 28 C40 28 38 31 34 31" fill="none" stroke="url(#brain)" stroke-width="2" stroke-linecap="round"/>
  <path d="M19 37 C23 37 25 40 30 40" fill="none" stroke="url(#brain)" stroke-width="2" stroke-linecap="round"/>
  <path d="M45 37 C41 37 39 40 34 40" fill="none" stroke="url(#brain)" stroke-width="2" stroke-linecap="round"/>
  <!-- Central Lightning Energy Bolt -->
  <path d="M33 18 L27 30 L32 30 L29 44 L37 31 L32 31 Z" fill="url(#bolt)" filter="url(#glow)"/>
</svg>
